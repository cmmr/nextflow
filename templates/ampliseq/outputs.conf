#
# outputs.conf - What the "All output files" view of an ampliseq dashboard lists.
#
# Read by publish_dashboard.sh, top to bottom, as
#
#     group | path | label | description
#
# with the fields trimmed and blank or "#" lines skipped. Groups appear in the
# order they are first named here, and so do the entries within them.
#
# A path is relative to the results folder and may be a glob, which lists one
# row per match. A path ending in "/" is a folder: it links to that folder's
# listing page and is counted rather than sized. An entry whose path matches
# nothing is left out, which is how a group that a run skipped disappears.
#
# An empty label leaves the path itself as the link text, and the row reports
# the file's size. A labelled entry names something rather than a file, so it
# reports no size.
#
# Extensions decide what a link does: a text or web format opens in a new tab,
# and anything else downloads. See DOWNLOAD_EXTENSIONS in publish_dashboard.sh.
#

Start here | summary_report/summary_report.html    |                  | How the analysis was run and what it found, written out step by step. Start here if you are reading these results for the first time.
Start here | multiqc/multiqc_report.html           |                  | Sequencing quality across every FASTQ file in the run, in one interactive report.
Start here | qiime2/abundance_tables/feature-table.biom |             | The ASV abundance table in BIOM v2 format, carrying taxonomy as observation metadata. This is the file to load into QIIME 2, phyloseq or biom-format.
Start here | raw-sequences.zip                     |                  | Every sequencing file this analysis was run on, exactly as it went in.

Abundance tables | qiime2/abundance_tables/feature-table.tsv | | The same ASV table as plain text: one row per ASV, one column per sample.
Abundance tables | qiime2/abundance_tables/filtered-table.qza | | The filtered feature table as a QIIME 2 artifact, FeatureTable[Frequency].
Abundance tables | qiime2/abundance_tables/ | | Counts collapsed to each taxonomic level, from phylum (level 2) to genus (level 6), and the record of what the abundance filter removed.
Abundance tables | qiime2/rel_abundance_tables/ | | The same tables as percentages of each sample, plus a per-ASV table with its DADA2 taxonomy already joined on.
Abundance tables | dada2/ASV_table.tsv | | ASV counts as DADA2 produced them, before any QIIME 2 filtering.
Abundance tables | summary_tables/ | | Overall abundance and taxonomy summaries.

Taxonomy | qiime2/barplot/index.html | qiime2/barplot/ | Interactive stacked bar chart of composition by sample and taxonomic level, with the underlying CSV for each level.
Taxonomy | dada2/ASV_tax_species.*.tsv | | Taxonomy for each ASV, down to species where the sequence matched a reference exactly.
Taxonomy | dada2/ASV_tax.*.tsv | | Taxonomy for each ASV from the DADA2 classifier, genus level and above.
Taxonomy | qiime2/taxonomy/ | | The second opinion from the QIIME 2 classifier, when one was requested.
Taxonomy | kraken2/ | | Read-level classification with Kraken2, when one was requested.
Taxonomy | sintax/ | | Read-level classification with SINTAX, when one was requested.
Taxonomy | qiime2/input/taxonomy.qza | | Taxonomy as a QIIME 2 artifact, FeatureData[Taxonomy].
Taxonomy | dada2/ref_taxonomy.*.txt | | Which reference database was used for the assignments above, and how to cite it.

Sequences | dada2/ASV_seqs.fasta | | The ASV sequences themselves, named by the hash used as the feature ID in every table here.
Sequences | savont/ | | The ASVs Savont called from Oxford Nanopore reads, in place of DADA2.
Sequences | qiime2/representative_sequences/ | | The same sequences after filtering, as FASTA and as a QIIME 2 artifact, with their length statistics.
Sequences | qiime2/phylogenetic_tree/ | | The phylogeny built from those sequences, which UniFrac and Faith's PD need.
Sequences | raw-sequences.zip | | Every sequencing file this analysis was run on, exactly as it went in.

Diversity | qiime2/diversity/ | | Alpha and beta diversity: distance matrices, ordinations, and the tests run against the sample metadata.
Diversity | qiime2/alpha-rarefaction/ | | Rarefaction curves, for judging whether each sample was sequenced deeply enough.
Diversity | qiime2/ancombc/ | | ANCOM-BC differential abundance results.
Diversity | qiime2/ancombc2/ | | ANCOM-BC2 differential abundance results.

Functional prediction | picrust/ | | PICRUSt2's predicted gene and pathway abundances, inferred from the 16S profile rather than measured.

Quality control | overall_summary.tsv | | Reads surviving each stage of the pipeline, one row per sample. The first place to look when a sample comes out thin.
Quality control | dada2/DADA2_stats.tsv | | The same accounting for the DADA2 steps alone: filtering, denoising, merging, and chimera removal.
Quality control | fastqc/ | | The FastQC report for each individual FASTQ file, which MultiQC summarises.
Quality control | dada2/QC/ | | Read quality profiles and the fitted DADA2 error models, as PDF and SVG.
Quality control | barrnap/ | | Which ASVs look like rRNA genes, and of what kind. Used to drop anything that is not the gene that was sequenced.
Quality control | cutadapt/ | | Primer trimming logs, one per sample.
Quality control | porechop_abi/ | | Adapter trimming logs for Oxford Nanopore reads.

Objects for R | phyloseq/dada2_phyloseq.rds | | A phyloseq object with the table, taxonomy and sequences already assembled. readRDS() and go.
Objects for R | treesummarizedexperiment/dada2_TreeSummarizedExperiment.rds | | The same data as a TreeSummarizedExperiment, for Bioconductor workflows.

How this run was set up | ampliseq_args.yaml | | Every parameter the pipeline was given.
How this run was set up | nextflow_command.sh | | The command that produced these results, exactly as it was run.
How this run was set up | region_detection.txt | | How the amplified region and the sequencing platform were measured from the reads.
How this run was set up | input/ampliseq_samplesheet.tsv | | The samplesheet the pipeline read, after sample names were merged and sanitised.
How this run was set up | pipeline_info/ | | Nextflow's own execution report, timeline, trace and software versions.
