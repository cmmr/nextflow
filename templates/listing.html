<!doctype html>
<!--
  listing.html - Listing page for one folder of a published run.

  Rendered by scripts/index_directories.sh, once for every subdirectory of a
  results folder, and uploaded to S3 with the folder it describes. S3 serves
  objects rather than directories, so without these pages the folder links
  summary_report.html carries lead nowhere.

  Everything is inline and every link is relative, because this file is served
  from S3 next to the objects it lists and has no origin to fetch from.

  Placeholders are DIR_PATH and ROWS, each wrapped in doubled underscores. They
  are deliberately not spelled that way in this comment - the renderer
  substitutes the whole file, comment included, and would paste the listing in
  here too. ROWS is markup the renderer emits itself, having escaped and
  URL-encoded every name it read off the disk.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__DIR_PATH__</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --header-bg: #f4f6f8;
    --border: #d7dde3;
    --text: #1b2733;
    --muted: #5c6b7a;
    --accent: #1f6feb;
    --row: #f8fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --header-bg: #1a2129;
      --border: #2c3742;
      --text: #e6edf3;
      --muted: #9aa7b4;
      --accent: #3b82f6;
      --row: #171e25;
    }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
  }

  header {
    padding: 14px 22px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
  }
  header .meta {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  /* The report is framed by the run's landing page, so up leaves the frame
     rather than nesting a second page inside it */
  header .meta a { color: var(--accent); text-decoration: none; }
  header .meta a:hover { text-decoration: underline; }

  main { padding: 14px 22px 28px; }

  table {
    width: 100%;
    max-width: 900px;
    border-collapse: collapse;
    font-size: 14px;
  }
  tbody tr:nth-child(odd) { background: var(--row); }
  td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  /* Filenames, so set in the face filenames are read in */
  td.name {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
  }
  td.name a { color: var(--accent); text-decoration: none; }
  td.name a:hover { text-decoration: underline; }
  /* Folders read as folders before the name is */
  td.name .dir { font-weight: 600; }
  td.size {
    width: 8em;
    text-align: right;
    white-space: nowrap;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>__DIR_PATH__</h1>
  <p class="meta"><a href="../index.html" target="_top">&uarr; Up one folder</a></p>
</header>

<main>
__ROWS__
</main>

</body>
</html>
