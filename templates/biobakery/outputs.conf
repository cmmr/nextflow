#
# outputs.conf - What the "All output files" view of a biobakery dashboard lists.
#
# Read by publish_dashboard.sh, top to bottom, as
#
#     group | path | label | description
#
# in the format templates/taxprofiler/outputs.conf describes. An entry whose
# path matches nothing is left out, which is how a module a run did not enable
# disappears.
#

Start here | multiqc/multiqc_report.html | | Read quality before and after KneadData cleaned the reads, as FastQC measured it, and how many reads each sample kept at every cleaning step.
Start here | metaphlan/metaphlan-species-relab.tsv | | Every species MetaPhlAn found, as a percentage of each sample. The percentages are of every read MetaPhlAn processed, so a column adds up to less than 100 by the share it could not place.
Start here | humann/pathway-abundance-relab.tsv | | What the community can do rather than what is in it: the relative abundance of every MetaCyc pathway HUMAnN found, per sample. This is the functional counterpart of the species table above, and the file to start from for functional comparisons between groups.
Start here | HELD:raw-sequences/ | raw-sequences/ | Every sequencing file this analysis was run on, exactly as it went in. Listed here for the record; the files themselves come down with the archive at the end of this index.

Taxonomic profiles | metaphlan/metaphlan-relab.tsv | | Every clade MetaPhlAn found at every rank, from kingdom down to species-level genome bin, as a percentage of each sample. The UNCLASSIFIED row is the share of reads it placed nowhere.
Taxonomic profiles | metaphlan/profiles/ | | One MetaPhlAn profile per sample. Beside each clade's relative abundance these carry its marker coverage and the number of reads MetaPhlAn estimates it contributed, which the merged tables above do not.

Functional profiles | humann/ | | Everything HUMAnN produced, as one folder. Its tables are the metabolic capacity encoded in the reads: which reactions and pathways the community carries, and how much of each. Nothing here is a measure of activity - that would need RNA - and nothing here can find a taxon MetaPhlAn did not, since HUMAnN searches the pangenomes of the species MetaPhlAn called and nothing else.
Functional profiles | humann/pathway-abundance-rpk.tsv | | Every MetaCyc pathway per sample, in reads per kilobase - depth-carrying numbers, before any normalisation. Use these where the analysis wants counts rather than proportions.
Functional profiles | humann/pathway-abundance-relab.tsv | | The same pathways as a share of the sample, which is what comparisons between samples of different depths want.
Functional profiles | humann/pathway-coverage.tsv | | How confidently each pathway is present, from 0 to 1: the share of its reactions found above the median reaction abundance in that sample. Most values land at 0 or 1. A pathway with an abundance in the table above but a coverage of 0 here was called off reactions too scarce to count as present - expect many of those. Not normalised - this is a confidence, not an amount.
Functional profiles | humann/gene-families-rpk.tsv | | Every UniRef90 gene family per sample, in reads per kilobase. This is HUMAnN's primary output and the largest table here; everything below is it, regrouped.
Functional profiles | humann/gene-families-relab.tsv | | The same gene families as a share of the sample.
Functional profiles | humann/ec-rpk.tsv | | Gene families summed onto level-4 EC numbers - the enzyme each one performs - in reads per kilobase. Far fewer rows than the UniRef90 table and named, which makes it the one to read by eye.
Functional profiles | humann/ec-relab.tsv | | The same enzymes as a share of the sample.
Functional profiles | humann/ko-rpk.tsv | | Gene families summed onto KEGG Orthology identifiers, in reads per kilobase. KEGG modules and KEGG pathways are not here: those definitions are licence-restricted, and only the KO mapping is distributed with HUMAnN.
Functional profiles | humann/ko-relab.tsv | | The same KO identifiers as a share of the sample.
Functional profiles | humann/*-by-taxon.tsv | | The table of the same name with every value split among the species HUMAnN attributed it to, plus an unclassified row for the reads that matched a gene family but no species pangenome. The taxonomy is MetaPhlAn's, the same one the profiles above are built on.
Functional profiles | humann/alignment-summary.tsv | | How far HUMAnN got with each sample: how many species its prescreen put in that sample's pangenome database, what share of reads was still unaligned after the nucleotide search and after the translated search, and how many gene families it ended with. A sample missing from this table is one HUMAnN could not finish.
Functional profiles | humann/logs/ | | HUMAnN's own account of each sample, one log per sample, including which species it found and how long each search took.

Quality control | kneaddata/read-counts.tsv | | Reads per sample after each KneadData step: as sequenced, after Trimmomatic, after host depletion, and what was kept. Mates are counted separately, and an orphan is a read whose mate was removed.
Quality control | kneaddata/fastqc/ | | The FastQC report for every sample's reads, before and after KneadData.
Quality control | kneaddata/logs/ | | KneadData's own log for each sample, including the Trimmomatic and bowtie2 commands it ran.

How this run was set up | biobakery_args.yaml | | Every parameter the workflow was given, including which modules ran and which databases they read.
How this run was set up | nextflow_command.sh | | The command that produced these results, exactly as it was run.
How this run was set up | pipeline_info/ | | Nextflow's own execution report, timeline and trace.

Everything at once | __BUNDLE_URL__ | Everything from this run | One zip holding the raw sequencing data and every file listed above, plus the pages you are reading them through. It unpacks into raw-sequences/ beside results/; open the index.html in results/ to browse it all offline, raw sequences included. This is the whole of what expires.
