#
# prune.conf - What an ampliseq run publishes for itself rather than for the
#              requester, and is deleted before the results are indexed.
#
# Read by prune_results.sh, top to bottom, as
#
#     action | path | argument
#
# with the fields trimmed and blank or "#" lines skipped. "remove" deletes
# everything the path matches - a path ending in "/" matches directories only -
# and "drop-zero-rows" rewrites a merged table, keeping the rows that carry a
# count and taking the argument as the first data column. A path matching
# nothing is skipped, which is how a step this run did not perform disappears.
#
# Two rules decide what is named here. A set of per-sample files goes when a
# merged file published beside it carries the same numbers, since the merged one
# is what anybody loads. Everything else goes only when it is a tool's own
# scratch or a second encoding of a report already published - not when it is
# the only place something is written down.
#
# An amplicon run is small enough that little of this is about storage. It is
# about a file index a reader can read: the ASV table, its taxonomy and the
# sequences should not be listed three times each because DADA2 wrote its
# working copies beside the finished ones.
#

# -- Files that are a second copy of a file kept beside them ------------------
#
# DADA2 classifies the ASVs in chunks and concatenates the results. With one
# chunk - which is every run we do - the chunk and the concatenation are the
# same bytes: ASV_seqs.1.ASV_tax.<db>.tsv is ASV_tax.<db>.tsv, checked on both
# of the runs this was written for.
remove | dada2/chunks/

# The read-quality profiles and the fitted error models are published as PDF
# beside these; the SVG copies are the same six figures at twenty times the size.
remove | dada2/QC/svg/

# DADA2 writes one of these per plot to say how many files it read. The number
# is in the plot's own title.
remove | dada2/QC/*plotQualityProfile.txt

# Adapter trimming's per-sample log is a few hundred kilobytes of every adapter
# Porechop considered, per sample. What came off is in the MultiQC report, in
# multiqc_data/porechop.txt, and in overall_summary.tsv.
remove | porechop_abi/*.log

# -- MultiQC's own working files ----------------------------------------------
#
# The report is what a reader opens, and the per-plot .txt files beside it are
# the numbers behind each figure. These four are the whole report encoded again
# - as JSON, as parquet, as a prompt, and as its debug trace.
remove | multiqc/multiqc_data/multiqc_data.json
remove | multiqc/multiqc_data/multiqc.parquet
remove | multiqc/multiqc_data/llms-full.txt
remove | multiqc/multiqc_data/multiqc.log

# Every figure in the report rendered a second time as PNG, SVG and PDF
remove | multiqc/multiqc_plots/

# A FastQC zip holds the same measurements as the HTML report beside it, which
# is also what MultiQC read to build its own.
remove | fastqc/*_fastqc.zip
