#
# prune.conf - What a taxprofiler run publishes for itself rather than for the
#              requester, and is deleted before the results are indexed.
#
# Read by prune_results.sh, top to bottom, as
#
#     action | path | argument
#
# with the fields trimmed and blank or "#" lines skipped. "remove" deletes
# everything the path matches - a path ending in "/" matches directories only -
# and "drop-zero-rows" rewrites a merged table, keeping the rows that carry a
# count and taking the argument as the first data column. A path matching
# nothing is skipped, which is how a step this run did not perform disappears.
#
# Two rules decide what is named here. A set of per-sample files goes when a
# merged file published beside it carries the same numbers, since the merged one
# is what anybody loads. Everything else goes only when it is a tool's own
# scratch or a second encoding of a report already published - not when it is
# the only place something is written down.
#

# -- Per-sample profiles, all of them merged beside themselves ----------------
#
# Kraken2's per-sample reports are the columns of kraken2_*_combined_reports.txt
# and the rows of taxpasta/kraken2_*.tsv; nothing in one is missing from the
# other two. The same holds for Bracken: its species-level estimates are the
# _num and _frac columns of bracken_*_combined_reports.txt and the whole of
# taxpasta/bracken_*.tsv, and its kraken-style report per sample is a column of
# the combined kraken2 report.
remove | kraken2/*/
remove | bracken/*/

# MetaPhlAn's per-sample profile is a column of metaphlan_*_combined_reports.txt,
# and the .biom beside it is that same profile in another format. The folder also
# holds MetaPhlAn's alignments - its record of which read hit which marker gene,
# kept only so that MetaPhlAn can be re-run without aligning again, and 1.2 GB of
# a 1.4 GB folder on the run this was written for.
remove | metaphlan/*/

# mOTUs' .out per sample is one column of motus_*_combined_reports.txt - the same
# 34,344 rows in the same order - and the .log beside it is its mapping trace,
# which MultiQC has already read.
remove | motus/*/

# sylph's per-sample files are not removed. The merged table carries one column
# per sample of whichever abundance sylph_data_type named; the per-sample files
# also carry the containment ANI and the effective coverage each detection was
# called on, which is what says whether to believe it. They are hundreds of
# kilobytes, not gigabytes.

# -- Files that are a second copy of a file kept beside them ------------------
#
# nf-core/taxprofiler names Bracken's kraken-style outputs "<db>-bracken", but
# what it aggregates there are Kraken2's own clade counts: on the run this was
# written for the two combined reports are byte-identical below their headers,
# and so are the two taxpasta tables once their columns are put in the same
# order. Two names for one table is worse than one, so the plain-named one -
# which does not promise Bracken's estimates - is the one kept.
remove | kraken2/kraken2_*-bracken_combined_reports.txt
remove | taxpasta/kraken2_*-bracken.tsv

# fastp's JSON is every number in the HTML report published beside it, written
# for a machine; the .log is what it printed while it ran, which MultiQC read.
remove | fastp/*.fastp.json
remove | fastp/*.fastp.log

# Host removal's per-sample alignment rates are in the MultiQC report and in
# multiqc_data/multiqc_bowtie2.txt; the samtools dump beside them is the same
# alignment counted again, at a length nobody reads.
remove | bowtie2/align/*.log
remove | minimap2/align/*.log
remove | samtools/stats/*.stats

# Nonpareil's .npl is what it printed while fitting the curve. The .npo the
# curve is read from, the plots and the summary table all stay.
remove | nonpareil/*.npl

# -- MultiQC's own working files ----------------------------------------------
#
# The report is what a reader opens, and the per-plot .txt files beside it are
# the numbers behind each figure. These four are the whole report encoded again
# - as JSON, as parquet, as a prompt, and as its debug trace.
remove | multiqc/multiqc_data/multiqc_data.json
remove | multiqc/multiqc_data/multiqc.parquet
remove | multiqc/multiqc_data/llms-full.txt
remove | multiqc/multiqc_data/multiqc.log

# And these are whole profile tables restated inside MultiQC's data folder,
# where the published tables are what anybody would use instead.
remove | multiqc/multiqc_data/multiqc_kraken.txt
remove | multiqc/multiqc_data/multiqc_bracken*.txt
remove | multiqc/multiqc_data/multiqc_metaphlan.txt
remove | multiqc/multiqc_data/multiqc_nonpareil.txt

# Every figure in the report rendered a second time as PNG, SVG and PDF
remove | multiqc/multiqc_plots/

# A FastQC zip holds the same measurements as the HTML report beside it, which
# is also what MultiQC read to build its own.
remove | fastqc/*/*_fastqc.zip

# -- A tool's own scratch, kept only for re-running that tool ------------------
#
# Nonpareil's per-read redundancy values and mating vector, which grow with the
# reads rather than with the answer
remove | nonpareil/*.npa
remove | nonpareil/*.npc

# -- Rows that are the database rather than the run ---------------------------
#
# A mOTUs profile is a row for every species-level marker gene cluster in the
# database, so a run that saw 1,302 of them still publishes 34,344 rows. The
# first two columns are the taxon and its NCBI id; the samples start at three.
drop-zero-rows | motus/motus_*_combined_reports.txt | 3
