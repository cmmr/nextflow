<!doctype html>
<!--
  listing.html - Listing page for one folder of a published run.

  Rendered by scripts/index_directories.sh, once for every subdirectory of a
  results folder, and uploaded to S3 with the folder it describes. S3 serves
  objects rather than directories, so without these pages the folder links the
  report and the landing page carry lead nowhere.

  Everything is inline and every link is relative, because this file is served
  from S3 next to the objects it lists and has no origin to fetch from.

  Placeholders are COMMON_CSS, DIR_PATH and ROWS, each wrapped in doubled
  underscores. They are deliberately not spelled that way in this comment - the
  renderer substitutes the whole file, comment included, and would paste the
  listing in here too. ROWS is markup the renderer emits itself, having escaped
  and URL-encoded every name it read off the disk.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__DIR_PATH__</title>
<style>
__COMMON_CSS__

header h1 {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

main {
  flex: 1 1 auto;
  overflow: auto;
  padding: 14px 22px 28px;
}
table { max-width: 900px; }

/* Folders read as folders before the name is */
td.name .dir { font-weight: 600; }
</style>
</head>
<body>

<header>
  <div>
    <h1>__DIR_PATH__</h1>
    <!-- The report is framed by the run's landing page, so up leaves the frame
         rather than nesting a second page inside it -->
    <p class="meta"><a href="../index.html" target="_top">&uarr; Up one folder</a></p>
  </div>
</header>

<main>
__ROWS__
</main>

</body>
</html>
