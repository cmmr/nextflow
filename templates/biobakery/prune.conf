#
# prune.conf - What a biobakery run publishes for itself rather than for the
#              requester, and is deleted before the results are indexed.
#
# Read by prune_results.sh, top to bottom, as
#
#     action | path | argument
#
# in the format templates/taxprofiler/prune.conf describes. A path matching
# nothing is skipped.
#

# The same measurements as the FastQC HTML report beside each, which MultiQC
# has already read
remove | kneaddata/fastqc/*_fastqc.zip

# The MultiQC report encoded again, as JSON, as parquet, as a prompt and as its
# debug trace
remove | multiqc/multiqc_data/multiqc_data.json
remove | multiqc/multiqc_data/multiqc.parquet
remove | multiqc/multiqc_data/llms-full.txt
remove | multiqc/multiqc_data/multiqc.log

# Every figure in the report rendered again as PNG, SVG and PDF
remove | multiqc/multiqc_plots/

# MetaPhlAn's per-sample profiles. The merged tables beside them are what a
# reader loads; biobakery_composition.sh reads these for the Overview's plots
# and read counts, and runs before this.
remove | metaphlan/profiles/

# HUMAnN's log per sample, whose readings alignment-summary.tsv already carries
remove | humann/logs/

# KneadData's log per sample, whose read counts kneaddata/read-counts.tsv already
# carries
remove | kneaddata/logs/
