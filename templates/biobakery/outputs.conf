#
# outputs.conf - What the "All output files" view of a biobakery dashboard lists.
#
# Read by publish_dashboard.sh, top to bottom, as
#
#     group | path | label | description
#
# in the format templates/taxprofiler/outputs.conf describes. An entry whose
# path matches nothing is left out, which is how a module a run did not enable
# disappears.
#
# Each group is the tool that wrote its files, headed by a description of how
# that tool made them.
#

KneadData | | | KneadData 0.12.4 cleans each sample's reads in three steps before anything is profiled. Trimmomatic clips Nextera adapter sequence, cuts each read where the average quality over four consecutive bases first drops below 20, and discards any read left shorter than half its sequenced length. Tandem Repeats Finder then discards reads made up mostly of short tandem repeats. Last, bowtie2 (--very-sensitive-local) aligns what remains to the host reference named in biobakery_args.yaml - PhiX alone, or the human T2T-CHM13v2.0 or mouse GRCm39 genome together with PhiX - and removes every read that aligns, along with its mate.
KneadData | | | A read whose mate was removed at any step is kept as an orphan and profiled with the rest. FastQC measured the reads before and after cleaning, and MultiQC gathered those reports and the read counts below into the QC Report.
KneadData | kneaddata/read-counts.tsv | | Reads per sample after each KneadData step: as sequenced, after Trimmomatic, after host depletion, and what was kept. Mates are counted separately, and an orphan is a read whose mate was removed.
KneadData | kneaddata/fastqc/ | | The FastQC report for every sample's reads, before and after KneadData.

MetaPhlAn | | | MetaPhlAn 4.1.1 identifies the microbes in each sample from clade-specific marker genes: genes found in every genome of one species-level genome bin (SGB) and in no other. Its mpa_vJun23_CHOCOPhlAnSGB_202403 database holds millions of such markers for bacterial, archaeal and eukaryotic SGBs, drawn from over a million reference genomes and metagenome-assembled genomes, so it detects many species that have never been cultured - named by SGB number where they have no species name.
MetaPhlAn | | | bowtie2 aligns each sample's cleaned reads, orphans included, to those markers. A clade is reported when enough of its markers are hit, and its abundance is the average read depth across its markers once the most and least covered fifth are set aside, summed up the tree from SGB to kingdom. The share of reads that could not be attributed to any known clade is reported as UNCLASSIFIED rather than the rest being rescaled to 100%. A species with no SGB in the database cannot be detected, and its reads count toward that share.
MetaPhlAn | metaphlan/metaphlan-species-relab.tsv metaphlan/metaphlan-relab.tsv | | Every clade MetaPhlAn found, as a percentage of each sample: species only in the first table, and every rank from kingdom down to SGB in the second. The UNCLASSIFIED row, in the second table only, is the share of reads it placed nowhere, which is why a sample's species add up to less than 100.
MetaPhlAn | metaphlan/metaphlan-species-reads.tsv metaphlan/metaphlan-species-reads.json.biom metaphlan/metaphlan-species-reads.hdf5.biom | | Every species as whole-number read counts: the reads MetaPhlAn estimates each species contributed, which is its marker coverage multiplied back up by genome length. Unlike the percentages these carry sequencing depth, which is what rarefaction and count-based differential abundance want. The same table three ways - classic tabular BIOM, BIOM 1.0 JSON and BIOM 2.1 HDF5 - one row per species, with its lineage as the taxonomy. This is the file to load into rbiom, QIIME 2, phyloseq or biom-format.
MetaPhlAn | metaphlan/metaphlan-reads.tsv | | The same read counts for every clade at every rank from kingdom down to SGB, laid out like the percentage tables. The UNCLASSIFIED row is the reads MetaPhlAn placed nowhere.

HUMAnN | | | HUMAnN 3.9 profiles what each sample's community is genetically capable of: which gene families its reads encode, and which metabolic pathways those genes complete. It searches in two tiers. First, the species MetaPhlAn found at 0.01% or more are looked up in the ChocoPhlAn pangenome database (v201901b), and bowtie2 aligns every read to the genes of those species - fast, and each hit says which species the gene belongs to. ChocoPhlAn predates many of the SGBs MetaPhlAn 4 names, and a species it holds no pangenome for is skipped in this tier.
HUMAnN | | | Reads left unaligned go on to a translated search: DIAMOND compares them, as protein, with every UniRef90 protein cluster (v201901b), keeping hits of at least 80% amino-acid identity across 90% of the read. This finds genes from species the first tier skipped, but cannot say whose they are, so those hits are reported as unclassified. A gene family is kept only when hits cover at least half of it, and its abundance is the alignment-weighted hit count divided by its length, in reads per kilobase (RPK).
HUMAnN | | | MinPath then picks the smallest set of MetaCyc pathways that explains the enzymatic reactions those gene families perform - for the community as a whole, and again for each species - and each pathway's abundance and coverage is computed from its reactions, tolerating one missing reaction. Finally the per-sample tables were joined, regrouped from UniRef90 onto EC numbers and KEGG Orthology, normalised to relative abundance, and split into community totals and per-species breakdowns. All of this is read from DNA: it describes what the community could do, not which genes were being expressed.
HUMAnN | humann/pathway-abundance-rpk.tsv humann/pathway-abundance-relab.tsv | | Every MetaCyc pathway per sample, first in reads per kilobase - depth-carrying numbers, before any normalisation, for analyses that want counts - then as a share of each sample, which is what comparisons between samples of different depths want. UNMAPPED and UNINTEGRATED are the reads that matched no gene family and the gene families that belong to no pathway.
HUMAnN | humann/pathway-coverage.tsv | | How confidently each pathway is present, from 0 to 1: the share of its reactions found above the median reaction abundance in that sample. Most values land at 0 or 1. A pathway with an abundance above but a coverage of 0 here was called off reactions too scarce to count as present - expect many of those. Not normalised - this is a confidence, not an amount.
HUMAnN | humann/gene-families-rpk.tsv humann/gene-families-relab.tsv | | Every UniRef90 gene family per sample, in reads per kilobase and as a share of each sample. These are HUMAnN's primary output and the largest tables here; the EC and KO tables below are these, regrouped.
HUMAnN | humann/ec-rpk.tsv humann/ec-relab.tsv | | Gene families summed onto level-4 EC numbers - the enzyme each one performs - in reads per kilobase and as a share of each sample. Far fewer rows than the UniRef90 tables and named, which makes these the ones to read by eye.
HUMAnN | humann/ko-rpk.tsv humann/ko-relab.tsv | | Gene families summed onto KEGG Orthology identifiers, in reads per kilobase and as a share of each sample. KEGG modules and KEGG pathways are not here: those definitions are licence-restricted, and only the KO mapping is distributed with HUMAnN.
HUMAnN | humann/pathway-abundance-rpk-by-taxon.tsv humann/pathway-abundance-relab-by-taxon.tsv humann/pathway-coverage-by-taxon.tsv humann/gene-families-rpk-by-taxon.tsv humann/gene-families-relab-by-taxon.tsv humann/ec-rpk-by-taxon.tsv humann/ec-relab-by-taxon.tsv humann/ko-rpk-by-taxon.tsv humann/ko-relab-by-taxon.tsv | | Each table above, with every value split among the species HUMAnN attributed it to, plus an unclassified row for what the translated search found but could not place in any species pangenome. Each is named after the table it breaks down.

How this run was set up | methods.html | | A paragraph saying how these profiles were made - every step, tool version and database, with its references - to paste into the methods section of a manuscript. The same page as Methods in the bar above.
How this run was set up | biobakery_args.yaml | | Every parameter the pipeline was given.
How this run was set up | nextflow_command.sh | | The command that produced these results, exactly as it was run.
How this run was set up | run_state.json | | The complete record of this run: the request as it was read, every parameter as resolved, the code commit and software versions that ran it, where each reference database came from and its checksums, and how the run went. Everything needed to reproduce these results.
How this run was set up | pipeline_info/ | | Nextflow's own execution report, timeline, trace and software versions.

