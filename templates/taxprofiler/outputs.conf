#
# outputs.conf - What the "All output files" view of a taxprofiler dashboard lists.
#
# Read by publish_dashboard.sh, top to bottom, as
#
#     group | path | label | description
#
# with the fields trimmed and blank or "#" lines skipped. Groups appear in the
# order they are first named here, and so do the entries within them.
#
# A path is relative to the results folder and may be a glob, which lists one
# row per match. A path ending in "/" is a folder: it links to that folder's
# listing page and is counted rather than sized. An entry whose path matches
# nothing is left out, which is how a group that a run skipped disappears.
#
# An entry may name several paths, separated by spaces. Its rows, and every row
# a glob matches, are set together as one block under one description. A line
# with no path and no label describes the group itself: it is a paragraph under
# the group's heading, and several such lines are several paragraphs.
#
# An empty label leaves the path itself as the link text, and the row reports
# the file's size. A labelled entry names something rather than a file, so it
# reports no size.
#
# __BUNDLE_URL__ is the one archive a run publishes to the CMMR-Nextflow guest
# collection: the reads it was given and this whole dashboard in a single zip.
# That row reports the size the archive came out at, which is the only size here
# not read off a file sitting beside this page. A run that published no archive
# drops the row.
#
# A path marked HELD: is a folder listed but not published - the reads, which
# are only inside that archive. It is counted where the run staged it, beside
# the results rather than in them, and its row leads to the listing written for
# it inside them. Both that row and every name in that listing are greyed until
# the page is read out of an unpacked copy of the download.
#
# Extensions decide what a link does: a text or web format opens in a new tab,
# and anything else downloads. See DOWNLOAD_EXTENSIONS in publish_dashboard.sh.
#
# What a run produced for itself rather than for the requester is deleted before
# any of this is indexed - see templates/taxprofiler/prune.conf - so a row here
# reports what a reader will actually find.
#

Start here | multiqc/multiqc_report.html | | Every step of the run in one interactive report: read quality before and after trimming, how much was removed as host or adapter, and how much each classifier could place.
Start here | krona/*.html | | Interactive sunburst of what was found, one per classifier and database. Click a wedge to zoom into that clade.
Start here | feature_table/feature-table.hdf5.biom | | Every species' counts and taxonomy in one BIOM v2.1 (HDF5) file, with the tree UniFrac and Faith's PD are computed over inside it. This is the file to load into rbiom, QIIME 2, phyloseq or biom-format. The same table in plain text and in BIOM v1.0 JSON sits beside it.
Start here | count_tables/ | | Every profiler's result as a plain species-by-sample matrix of whole numbers. Start here if you are loading this into R or Python rather than browsing it.
Start here | alpha_diversity.tsv | | Per-sample diversity: read depth, the Nonpareil diversity index and the share of the community the reads covered, how much sequencing 95% coverage would take, how many mOTUs were found, and Faith's PD off each of the two trees with the share of the sample it was computed over beside it. These are the numbers behind the plots on the Overview.
Start here | motus/motus_*_combined_reports.txt | | Every sample's mOTUs profile in one table, as counts already corrected for marker gene length. mOTUs counts universal marker genes rather than whole genomes, so it finds species no reference genome has been assembled for - over half the signal here is in taxa with no NCBI name. Read mOTUs from this file rather than from taxpasta/, which folds all of those into one unnamed row.
Start here | humann/pathway-abundance-relab.tsv | | What the community can do rather than what is in it: the relative abundance of every MetaCyc pathway HUMAnN found, per sample. This is the functional counterpart of the species table above, and the file to start from for functional comparisons between groups.
Start here | HELD:raw-sequences/ | raw-sequences/ | Every sequencing file this analysis was run on, exactly as it went in. Listed here for the record; the files themselves come down with the archive at the end of this index.

Count tables | count_tables/bracken-reads.tsv | | Reads per species per sample, from Bracken. Whole numbers that carry sequencing depth, which is what rarefaction and count-based differential abundance want.
Count tables | count_tables/kraken2-reads.tsv | | Reads per species from Kraken2, with every rank accounted for: reads assigned below species roll up into it, and reads assigned at genus and above become one "<taxon> unclassified" species each. Kraken2 places only about half its classified reads at species, so a plain species filter would silently drop the rest.
Count tables | count_tables/metaphlan-cells.tsv | | MetaPhlAn's own coverage estimate per species, put on the scale of the reads placed beside it. Coverage is genome copies, so this counts organisms where the Kraken2 and Bracken tables count reads.
Count tables | count_tables/metaphlan-reads.tsv | | The read count MetaPhlAn estimates each species contributed, which is its coverage multiplied back up by genome length. The merged report under metaphlan/ carries neither of these columns.
Count tables | count_tables/motus-cells.tsv | | mOTUs' scaled insert counts, the same numbers as its merged report. Its markers are universal single-copy genes, so a count here counts organisms rather than reads.

Profiles | bracken/ | | Bracken's abundance estimates, which redistribute Kraken2's higher-level assignments down to species. Use these for composition rather than the raw Kraken2 counts.
Profiles | motus/ | | mOTUs' profiles merged into one table, plus the .mgc read count per marker gene cluster behind each sample's call.
Profiles | kraken2/ | | Kraken2's clade counts for every sample in one report per database, and the per-sample reports those were merged from. Each of those carries a count of distinct minimizers beside every taxon, which separates a taxon seen across its whole genome from one called off the same short stretch repeated.
Profiles | metaphlan/ | | MetaPhlAn's marker-gene profiles. The merged table per database is relative abundances - percentages, not counts, because the script MetaPhlAn merges with reads only that column. The per-sample profiles beside it carry the coverage and estimated read count too, and count_tables/ is those merged.
Profiles | taxpasta/ | | The merged profile tables, one per classifier and database, keyed by NCBI taxon id. Read counts for Kraken2 and Bracken. The mOTUs table here collapses every taxon without an NCBI id - more than half of what mOTUs found - into a single unnamed row, so read that one from motus/ instead.
Profiles | krona/ | | The interactive charts, one per classifier and database.

Functional profiles | humann/ | | Everything HUMAnN produced, as one folder. Its tables are the metabolic capacity encoded in the reads: which reactions and pathways the community carries, and how much of each. Nothing here is a measure of activity - that would need RNA - and nothing here can find a taxon MetaPhlAn did not, since HUMAnN searches the pangenomes of the species MetaPhlAn called and nothing else.
Functional profiles | humann/pathway-abundance-rpk.tsv | | Every MetaCyc pathway per sample, in reads per kilobase - depth-carrying numbers, before any normalisation. Use these where the analysis wants counts rather than proportions.
Functional profiles | humann/pathway-abundance-relab.tsv | | The same pathways as a share of the sample, which is what comparisons between samples of different depths want.
Functional profiles | humann/pathway-coverage.tsv | | How confidently each pathway is present, from 0 to 1: the share of its reactions found above the median reaction abundance in that sample. Most values land at 0 or 1. A pathway with an abundance in the table above but a coverage of 0 here was called off reactions too scarce to count as present - expect many of those. Not normalised - this is a confidence, not an amount.
Functional profiles | humann/gene-families-rpk.tsv | | Every UniRef90 gene family per sample, in reads per kilobase. This is HUMAnN's primary output and the largest table here; everything below is it, regrouped.
Functional profiles | humann/gene-families-relab.tsv | | The same gene families as a share of the sample.
Functional profiles | humann/ec-rpk.tsv | | Gene families summed onto level-4 EC numbers - the enzyme each one performs - in reads per kilobase. Far fewer rows than the UniRef90 table and named, which makes it the one to read by eye.
Functional profiles | humann/ec-relab.tsv | | The same enzymes as a share of the sample.
Functional profiles | humann/ko-rpk.tsv | | Gene families summed onto KEGG Orthology identifiers, in reads per kilobase. KEGG modules and KEGG pathways are not here: those definitions are licence-restricted, and only the KO mapping is distributed with HUMAnN.
Functional profiles | humann/ko-relab.tsv | | The same KO identifiers as a share of the sample.
Functional profiles | humann/*-by-taxon.tsv | | The table of the same name with every value split among the species HUMAnN attributed it to, plus an unclassified row for the reads that matched a gene family but no species pangenome. The taxonomy is MetaPhlAn's, the same one the profiles above are built on.
Functional profiles | humann/alignment-summary.tsv | | How far HUMAnN got with each sample: how many species its prescreen put in that sample's pangenome database, what share of reads was still unaligned after the nucleotide search and after the translated search, and how many gene families it ended with. A sample missing from this table is one HUMAnN could not finish.
Functional profiles | humann/logs/ | | HUMAnN's own account of each sample, one log per sample, including which species it found and how long each search took.

Feature table | feature_table/ | | The profile as an object rather than as a table: counts, taxonomy and a tree in one file, written three ways - classic tab-separated text, BIOM v1.0 JSON, and BIOM v2.1 HDF5. Only the HDF5 one carries a tree where the BIOM 2.1 spec says it goes, which is what anything other than rbiom reads.
Feature table | feature_table/taxonomy-tree.newick | | The tree inside feature-table.hdf5.biom, on its own. It is the NCBI taxonomy over exactly the species this run saw, with a branch length on every edge set by how deep that rank sits - a taxonomy with lengths on it, not an inferred phylogeny. Faith's PD and UniFrac computed over it are taxonomic diversities; the numbers are not comparable with a Faith's PD from 16S data.
Feature table | feature_table/metaphlan-table.hdf5.biom | | MetaPhlAn's species abundances on the maximum-likelihood phylogeny published with its database - a real phylogeny, over the fewer species MetaPhlAn detects. Use this one where the branch lengths have to mean evolutionary distance.
Feature table | feature_table/metaphlan-tree.newick | | That phylogeny, cut back to the species this run found.

Diversity | nonpareil/ | | Nonpareil's redundancy curves, one per sample and one combining them, with the summary table behind the Overview's diversity plots. They measure how much of each community the sequencing reached by how often the same sequence recurs, so nothing here depends on a database.

Quality control | fastqc/ | | The FastQC report for each FASTQ file, before and after preprocessing.
Quality control | fastp/ | | Adapter and quality trimming reports, one per sample.
Quality control | bowtie2/ | | Host removal alignments for short reads, when the run was told to keep them.
Quality control | minimap2/ | | Host removal alignments for long reads, when the run was told to keep them.
Quality control | samtools/ | | What the host removal step kept and discarded, when the run was told to keep it.
Quality control | run_merging/ | | The reads as they went into classification, after runs of the same sample were merged.

How this run was set up | taxprofiler_args.yaml | | Every parameter the pipeline was given.
How this run was set up | taxprofiler_database.csv | | The databases this run classified against, and the read length Bracken was told to expect.
How this run was set up | nextflow_command.sh | | The command that produced these results, exactly as it was run.
How this run was set up | run_state.json | | The complete record of this run: the request as it was read, every parameter as resolved, the code commit and software versions that ran it, where each reference database came from and its checksums, and how the run went. Everything needed to reproduce these results.
How this run was set up | humann/humann_command.sh | | The command that produced the functional profiles, which is a second workflow run after the one above.
How this run was set up | pipeline_info/ | | Nextflow's own execution report, timeline, trace and software versions.

Everything at once | __BUNDLE_URL__ | Everything from this run | One zip holding the raw sequencing data and every file listed above, plus the pages you are reading them through. It unpacks into raw-sequences/ beside results/; open the index.html in results/ to browse it all offline, raw sequences included. This is the whole of what expires.
