<!doctype html>
<!--
  listing.html - Listing page for one folder of a published run.

  Rendered by scripts/index_directories.sh into every directory of a results
  folder, the results folder included, as directory_listing.html - never as
  index.html, which across a published run means a page something wrote to be
  read. S3 serves objects rather than directories, so without these pages the
  folder links the report and the landing page carry lead nowhere.

  Everything is inline and every link is relative, because this file is served
  from S3 next to the objects it lists and has no origin to fetch from.

  One listing is written for files that are not published beside it: the reads
  the run was given, which are only in the zip it publishes to Globus. Its rows
  are marked "held" and its note says so, which greys the names out and stops
  them being followed to a file the bucket does not hold. The script at the foot
  turns them back on for the same page read out of an unpacked copy of that zip,
  where the reads are two levels above it and every link does resolve. A folder
  read off disk is the run as it was given to the requester; a folder read over
  http is the published copy, which is the one holding these back.

  Placeholders are COMMON_CSS, DIR_PATH, UP_LINK, NOTE and ROWS, each wrapped in
  doubled underscores. They are deliberately not spelled that way in this comment
  - the renderer substitutes the whole file, comment included, and would paste
  the listing in here too. UP_LINK, NOTE and ROWS are markup the renderer emits
  itself, having escaped and URL-encoded every name it read off the disk.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__DIR_PATH__</title>
<style>
__COMMON_CSS__

header h1 {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0;
}

main {
  flex: 1 1 auto;
  overflow: auto;
  padding: 18px 22px 30px;
}
table { max-width: 900px; }

/* Folders read as folders before the name is */
td.name .dir { font-weight: 600; }

/* What this listing is for, when it is for something other than the folder it
   sits in */
.note {
  max-width: 900px;
  margin: 0 0 16px;
  padding: 10px 13px;
  border: 1px solid var(--notice-border);
  border-radius: 6px;
  background: var(--notice-bg);
  color: var(--notice-text);
  font-size: 13px;
  line-height: 1.45;
}

/* A row naming a file this copy of the page cannot hand over. The name and the
   size are still worth reading - this is the record of what went in - so the
   row stays and only the link goes. */
tr.held td.name a {
  color: var(--muted);
  pointer-events: none;
  cursor: default;
}

/* The copy that came down with the files, where every one of them is there to
   open */
html.local tr.held td.name a {
  color: var(--accent);
  pointer-events: auto;
  cursor: pointer;
}
html.local .note { display: none; }
</style>
</head>
<body>

<header>
  <div>
    <h1>__DIR_PATH__</h1>
    <!-- Up one folder at a time to the results folder's own listing, and from
         there out of the frame to the landing page - which is what stops the
         chain nesting a second dashboard inside the first -->
    <p class="meta">__UP_LINK__</p>
  </div>
</header>

<main>
__NOTE__
__ROWS__
</main>

<script>
// A page read off disk is the copy that came down inside this run's zip, where
// the files a published listing has to hold back are sitting beside it. Held
// rows are written held, so a listing served from the bucket is right with or
// without this.
if (location.protocol === "file:" || location.hostname === "localhost"
    || location.hostname === "127.0.0.1") {
  document.documentElement.className += " local";
}
</script>

</body>
</html>
