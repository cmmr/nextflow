#
# outputs.conf - What the "All output files" view of a taxprofiler dashboard lists.
#
# Read by publish_dashboard.sh, top to bottom, as
#
#     group | path | label | description
#
# with the fields trimmed and blank or "#" lines skipped. Groups appear in the
# order they are first named here, and so do the entries within them.
#
# A path is relative to the results folder and may be a glob, which lists one
# row per match. A path ending in "/" is a folder: it links to that folder's
# listing page and is counted rather than sized. An entry whose path matches
# nothing is left out, which is how a group that a run skipped disappears.
#
# An empty label leaves the path itself as the link text, and the row reports
# the file's size. A labelled entry names something rather than a file, so it
# reports no size.
#
# Extensions decide what a link does: a text or web format opens in a new tab,
# and anything else downloads. See DOWNLOAD_EXTENSIONS in publish_dashboard.sh.
#
# What a run produced but did not publish is named in taxprofiler_upload.sh, and
# a folder's count here leaves it out - so a row reports what the folder holds in
# the bucket rather than what it held on the cluster.
#

Start here | multiqc/multiqc_report.html | | Every step of the run in one interactive report: read quality before and after trimming, how much was removed as host or adapter, and how much each classifier could place.
Start here | krona/*.html | | Interactive sunburst of what was found, one per classifier and database. Click a wedge to zoom into that clade.
Start here | taxpasta/*.tsv | | Every sample's profile merged into one table, with taxon names and ranks already joined on. The file to load into R or Python.
Start here | alpha_diversity.tsv | | Per-sample diversity: read depth, the Nonpareil diversity index and the share of the community the reads covered, how much sequencing 95% coverage would take, and how many mOTUs were found. None of it depends on a classification database. These are the numbers behind the plots on the Overview.
Start here | metaphlan/metaphlan_*_combined_reports.txt | | Every sample's MetaPhlAn profile in one table. MetaPhlAn merges its own, on clade names rather than taxon IDs, which is what keeps clades of one species apart.
Start here | motus/motus_*_combined_reports.txt | | Every sample's mOTUs profile in one table. mOTUs counts universal marker genes rather than whole genomes, so it finds species no reference genome has been assembled for.

Profiles | bracken/ | | Bracken's abundance estimates, which redistribute Kraken2's higher-level assignments down to species. Use these for composition rather than the raw Kraken2 counts.
Profiles | kraken2/ | | Kraken2's per-sample reports and read-level classifications.
Profiles | metaphlan/ | | MetaPhlAn's marker-gene profiles, as relative abundances. Its alignment files are not published: they are only of use for re-running MetaPhlAn itself, and they are larger than everything else here put together.
Profiles | motus/ | | mOTUs' per-sample profiles: a read count for every species-level marker gene cluster in the database, and the reads that hit a marker gene without landing in one.
Profiles | taxpasta/ | | The merged profile tables, one per classifier and database.
Profiles | krona/ | | The interactive charts, one per classifier and database.

Diversity | nonpareil/ | | Nonpareil's redundancy curves, one per sample and one combining them, with the summary table behind the Overview's diversity plots. They measure how much of each community the sequencing reached by how often the same sequence recurs, so nothing here depends on a database. Its .npa and .npc working files are not published: they are intermediate steps to these, and larger than the rest of the run.

Quality control | fastqc/ | | The FastQC report for each FASTQ file, before and after preprocessing.
Quality control | fastp/ | | Adapter and quality trimming logs, one per sample.
Quality control | bowtie2/ | | Host removal alignment statistics for short reads.
Quality control | minimap2/ | | Host removal alignment statistics for long reads.
Quality control | samtools/ | | Read counts kept and discarded at the host removal step.
Quality control | run_merging/ | | The reads as they went into classification, after runs of the same sample were merged.

How this run was set up | taxprofiler_args.yaml | | Every parameter the pipeline was given.
How this run was set up | taxprofiler_database.csv | | The databases this run classified against, and the read length Bracken was told to expect.
How this run was set up | nextflow_command.sh | | The command that produced these results, exactly as it was run.
How this run was set up | pipeline_info/ | | Nextflow's own execution report, timeline, trace and software versions.
