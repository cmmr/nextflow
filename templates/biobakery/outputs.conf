#
# outputs.conf - What the file index of biobakery dashboards lists.
#
# Read by publish_dashboard.sh, top to bottom, as
#
#     group | path | label | description
#
# in the format templates/taxprofiler/outputs.conf describes. An entry whose
# path matches nothing is left out, which is how a module a run did not enable
# disappears.
#
# Each group is the tool that wrote its files, headed by a description of how
# that tool made them.
#

KneadData | | | KneadData 0.12.4 cleans each sample's reads in up to three steps before anything is profiled. Trimmomatic discards reads shorter than 60 bp, clips Nextera adapter sequence, cuts each read where the average quality over four consecutive bases first drops below 20, and discards any read left shorter than half its sequenced length. Tandem Repeats Finder then discards every read in which it finds a tandem repeat scoring 50 or more. Last, when a host was chosen, bowtie2 (--very-sensitive-local) aligns what remains to that host reference - PhiX alone, or the human T2T-CHM13v2.0 or mouse GRCm39 genome together with PhiX - and removes every read that aligns, along with its mate. The Methods page gives the settings each step actually ran with and the host this run was cleaned against.
KneadData | | | A read whose mate Trimmomatic or Tandem Repeats Finder discarded is kept as an orphan and profiled with the rest. FastQC measured the reads before and after cleaning, and MultiQC gathered those reports and the read counts below into the QC Report.
KneadData | kneaddata/read-counts.tsv | | Reads per sample after each KneadData step: as sequenced, after Trimmomatic, after host depletion, and what was kept. Mates are counted separately, and an orphan is a read whose mate was removed.
KneadData | kneaddata/fastqc/ | | The FastQC report for every sample's reads, before and after KneadData.

MetaPhlAn | | | MetaPhlAn 4.1.1 identifies the microbes in each sample from clade-specific marker genes: genes found in every genome of one species-level genome bin (SGB) and in no other. Its mpa_vJun23_CHOCOPhlAnSGB_202403 database holds millions of such markers for bacterial, archaeal and eukaryotic SGBs, drawn from over a million reference genomes and metagenome-assembled genomes, so it detects many species that have never been cultured - named by SGB number where they have no species name.
MetaPhlAn | | | bowtie2 aligns each sample's cleaned reads, orphans included, to those markers. A clade is reported when enough of its markers are hit, and its abundance is the average read depth across its markers once the most and least covered fifth are set aside, summed up the tree from SGB to kingdom. The share of reads that could not be attributed to any known clade is reported as UNCLASSIFIED rather than the rest being rescaled to 100%. A species with no SGB in the database cannot be detected, and its reads count toward that share.
MetaPhlAn | | | The profile is published at three levels of detail: metaphlan- tables hold every clade at every rank, species- tables only the species, and taxa- files the SGBs on MetaPhlAn's phylogeny, ready for tree-based analyses. A -counts file gives the reads MetaPhlAn estimates each clade contributed - its marker coverage multiplied back up by genome length - as whole numbers that carry sequencing depth, which is what rarefaction and count-based differential abundance want. A -relab file gives each clade as a percentage of every read in the sample, which is what comparing samples of different depths wants.
MetaPhlAn | metaphlan/metaphlan-counts.tsv metaphlan/metaphlan-relab.tsv | | MetaPhlAn's whole profile: every clade it found at every rank from kingdom down to SGB, eukaryotes included, as read counts and as percentages, one column per sample. A clade's value includes every clade below it. The UNCLASSIFIED row is the reads MetaPhlAn placed in no known clade, so the rows of any one rank, with UNCLASSIFIED, account for the whole sample. No tree.
MetaPhlAn | metaphlan/species-counts.tsv metaphlan/species-relab.tsv | | The same two tables cut down to the species rows and UNCLASSIFIED, so each sample's column adds up to the whole sample with nothing counted twice - the tables to read by eye or to compare samples species by species. They carry no tree: one species can span several SGBs, and so several tips of the phylogeny.
MetaPhlAn | metaphlan/taxa-counts.tsv metaphlan/taxa-counts.json.biom metaphlan/taxa-counts.hdf5.biom | | The feature table: read counts for every species-level genome bin (SGB), one row per SGB named by its SGB number, with its lineage from kingdom down to SGB as the taxonomy. A species MetaPhlAn splits into several SGBs has a row for each, and summing by the species rank puts it back together. The same table three ways - classic tabular BIOM, BIOM 1.0 JSON and BIOM 2.1 HDF5 - and the two .biom files carry the phylogeny below inside them, so UniFrac and Faith's PD can be computed from either. Every row has to be a tip on that tree, so there is no UNCLASSIFIED row and no eukaryotes, which the phylogeny does not include: a sample's counts total the reads placed on the tree, not its sequencing depth, and species-counts.tsv keeps both. This is the file to load into rbiom, QIIME 2, phyloseq or biom-format.
MetaPhlAn | metaphlan/taxa-tree.newick | | The tree inside the .biom files above, on its own: the maximum-likelihood phylogeny MetaPhlAn publishes for its database's SGBs, cut back to the SGBs this run found, with tips named by SGB number as the rows of taxa-counts are. A run with fewer than two SGBs on the phylogeny has no tree to publish, and its taxa-counts files carry none.

HUMAnN | | | HUMAnN 3.9 profiles what each sample's community is genetically capable of: which gene families its reads encode, and which metabolic pathways those genes complete. It searches in two tiers. First, the species MetaPhlAn found at 0.01% or more are looked up in the ChocoPhlAn pangenome database (v201901_v31), and bowtie2 aligns every read to the genes of those species - fast, and each hit says which species the gene belongs to. ChocoPhlAn predates many of the SGBs MetaPhlAn 4 names, and a species it holds no pangenome for is skipped in this tier.
HUMAnN | | | Reads left unaligned go on to a translated search: DIAMOND compares them, as protein, with every UniRef90 protein cluster (v201901b), keeping hits of at least 80% amino-acid identity across 90% of the read. This finds genes from species the first tier skipped, but cannot say whose they are, so those hits are reported as unclassified. A gene family is kept only when hits cover at least half of it, and its abundance is the alignment-weighted hit count divided by its length, in reads per kilobase (RPK).
HUMAnN | | | MinPath then picks the smallest set of MetaCyc pathways that explains the enzymatic reactions those gene families perform - for the community as a whole, and again for each species - and each pathway's abundance and coverage is computed from its reactions, tolerating one missing reaction. Finally the per-sample tables were joined, regrouped from UniRef90 onto EC numbers and KEGG Orthology, normalised to relative abundance, and split into community totals and per-species breakdowns. All of this is read from DNA: it describes what the community could do, not which genes were being expressed.
HUMAnN | humann/pathway-abundance-rpk.tsv humann/pathway-abundance-relab.tsv | | Every MetaCyc pathway per sample, first in reads per kilobase - depth-carrying numbers, before any normalisation, for analyses that want counts - then as a share of each sample, which is what comparisons between samples of different depths want. UNMAPPED and UNINTEGRATED are the reads that matched no gene family and the gene families that belong to no pathway.
HUMAnN | humann/pathway-coverage.tsv | | How confidently each pathway is present, from 0 to 1: the share of its reactions found above the median reaction abundance in that sample. Most values land at 0 or 1. A pathway with an abundance above but a coverage of 0 here was called off reactions too scarce to count as present - expect many of those. Not normalised - this is a confidence, not an amount.
HUMAnN | humann/gene-families-rpk.tsv humann/gene-families-relab.tsv | | Every UniRef90 gene family per sample, in reads per kilobase and as a share of each sample. These are HUMAnN's primary output and the largest tables here; the EC and KO tables below are these, regrouped.
HUMAnN | humann/ec-rpk.tsv humann/ec-relab.tsv | | Gene families summed onto level-4 EC numbers - the enzyme each one performs - in reads per kilobase and as a share of each sample. Far fewer rows than the UniRef90 tables and named, which makes these the ones to read by eye.
HUMAnN | humann/ko-rpk.tsv humann/ko-relab.tsv | | Gene families summed onto KEGG Orthology identifiers, in reads per kilobase and as a share of each sample. KEGG modules and KEGG pathways are not here: those definitions are licence-restricted, and only the KO mapping is distributed with HUMAnN.
HUMAnN | humann/pathway-abundance-rpk-by-taxon.tsv humann/pathway-abundance-relab-by-taxon.tsv humann/pathway-coverage-by-taxon.tsv humann/gene-families-rpk-by-taxon.tsv humann/gene-families-relab-by-taxon.tsv humann/ec-rpk-by-taxon.tsv humann/ec-relab-by-taxon.tsv humann/ko-rpk-by-taxon.tsv humann/ko-relab-by-taxon.tsv | | Each table above, with every value split among the species HUMAnN attributed it to, plus an unclassified row for what the translated search found but could not place in any species pangenome. Each is named after the table it breaks down.

Diversity | | | Two tools measure how diverse each sample is without depending on MetaPhlAn's database, and their readings are what the Overview's Alpha Diversity chart plots. Nonpareil 3.5.5 reads redundancy straight off the reads: how often a sequence turns up again among the others. From that it estimates how much of the community the sequencing covered, a diversity index (Nd), and how much sequencing 95% coverage would take. It is run over the first read of each pair KneadData kept, after host removal. mOTUs 3.1.0 aligns the same reads MetaPhlAn profiled to ten universal single-copy marker genes, grouped into species-level clusters (mOTUs), so it finds species no reference genome has been assembled for; the count of clusters it found in a sample is its richness.
Diversity | alpha_diversity.tsv | | Per-sample diversity: the reads MetaPhlAn processed, the Nonpareil diversity index and the share of the community the reads covered, the redundancy and model fit behind them, the sequencing Nonpareil saw and how much 95% coverage would take in Gbp, and the number of mOTUs found. A low model fit means the Nd and effort beside it are not to be trusted. NA is a reading the tool could not produce for that sample. These are the numbers behind the Overview's diversity chart.
Diversity | motus/motus-counts.tsv | | Every sample's mOTUs profile in one table: each species-level cluster with its NCBI taxon id where it has one, as insert counts scaled for marker gene length, so a count counts organisms rather than reads. Clusters found in no sample are left out, and the unassigned row is marker gene signal from organisms that belong to no cluster in the database.
Diversity | nonpareil/nonpareil-curves.tsv | | Nonpareil's summary per sample: redundancy (kappa), coverage (C), the sequencing it saw (LR, in bp), model fit (modelR), the sequencing 95% coverage would take (LRstar, in bp), and Nd (diversity). Coverage and redundancy are fractions here and percentages in alpha_diversity.tsv.
Diversity | nonpareil/nonpareil-curves.pdf | | Every sample's Nonpareil curve on one plot: coverage against sequencing effort, with the fitted model extending past the depth actually sequenced.

EsViritu | | | EsViritu 1.3.3 looks for human, animal and plant viruses by aligning each sample's cleaned read pairs - orphans are not used - to its database of 19,925 virus genome assemblies (v3.2.4). minimap2 aligns the reads, and an alignment counts only when it covers at least 100 bases and 90% of the read at 80% identity or better, so a virus is detected from a single read but only from one within roughly 80% identity of a genome in the database. Where several closely related genomes attract the same reads, EsViritu keeps the one that best explains them and aligns the reads to it again, then builds a consensus sequence from those alignments and aligns it to the whole database: the call moves to the taxon of a genome the consensus matches better, or up to what several genomes it matches equally well have in common.
EsViritu | | | Abundance is RPKMF: reads per kilobase of genome per million reads EsViritu read from the sample. Species and subspecies are assigned only when the identity to the reference reaches 90% and 95%; below that a row reads "unclassified" at that rank. A low identity suggests a virus related to, but different from, anything in the database. A sample with no row in the virus tables had no read align to any virus.
EsViritu | esviritu/virus-taxa.tsv | | The taxonomic profile: one row per virus taxon per sample, with its lineage from kingdom to subspecies, the reads aligned to it, its RPKMF, the mean read identity and consensus identity to its references, and the genome assemblies behind it. The table to start with.
EsViritu | esviritu/virus-assemblies.tsv | | One row per genome assembly detected per sample, a segmented virus's segments together: its lineage, reads aligned, bases covered, identities, RPKMF, and the accessions and segments it is made of. adj_taxonomy is true where the consensus check moved the call.
EsViritu | esviritu/virus-contigs.tsv | | The same per reference sequence - each segment of a segmented virus on its own row - with its length, mean depth and nucleotide diversity (Pi) among the reads aligned to it.
EsViritu | esviritu/virus-report.html | | Every detected virus in every sample as an interactive table, with a sparkline of read depth along each genome, which is the quickest way to tell a virus covered end to end from reads piled on one region.
EsViritu | esviritu/virus-coverage.tsv | | The depth behind those sparklines: each reference sequence cut into 100 windows, with the mean read depth in each, per sample.
EsViritu | esviritu/consensus/ | | Each sample's consensus sequence of every virus detected, from the reads aligned to it, as FASTA, called by samtools consensus from the reads EsViritu kept.
EsViritu | esviritu/read-counts.tsv | | The reads EsViritu read from each sample (filtered_reads), which RPKMF is divided by. Every sample EsViritu ran on is listed here, including those in which it found nothing.

Everything at once | __BUNDLE_URL__ | Everything from this run | One zip holding the raw sequencing data and everything this run published, plus the pages you are reading them through, laid out in the folders below. Unpack it and open results/index.html to browse it all offline, raw sequences included. This is the whole of what expires.
