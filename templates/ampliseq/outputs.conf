#
# outputs.conf - What the "All output files" view of an ampliseq dashboard lists.
#
# Read by publish_dashboard.sh, top to bottom, as
#
#     group | path | label | description
#
# with the fields trimmed and blank or "#" lines skipped. Groups appear in the
# order they are first named here, and so do the entries within them.
#
# A path is relative to the results folder and may be a glob, which lists one
# row per match. A path ending in "/" is a folder: it links to that folder's
# listing page and is counted rather than sized. An entry whose path matches
# nothing is left out, which is how a group that a run skipped disappears.
#
# An empty label leaves the path itself as the link text, and the row reports
# the file's size. A labelled entry names something rather than a file, so it
# reports no size.
#
# __BUNDLE_URL__ is the one archive a run publishes to the CMMR-Nextflow guest
# collection: the reads it was given and this whole dashboard in a single zip.
# That row reports the size the archive came out at, which is the only size here
# not read off a file sitting beside this page. A run that published no archive
# drops the row.
#
# A path marked HELD: is a folder listed but not published - the reads, which
# are only inside that archive. It is counted where the run staged it, beside
# the results rather than in them, and its row leads to the listing written for
# it inside them. Both that row and every name in that listing are greyed until
# the page is read out of an unpacked copy of the download.
#
# Extensions decide what a link does: a text or web format opens in a new tab,
# and anything else downloads. See DOWNLOAD_EXTENSIONS in publish_dashboard.sh.
#

Start here | summary_report/summary_report.html    |                  | How the analysis was run and what it found, written out step by step. Start here if you are reading these results for the first time.
Start here | multiqc/multiqc_report.html           |                  | Sequencing quality across every FASTQ file in the run, in one interactive report.
Start here | feature_table/feature-table.hdf5.biom | | Every ASV's counts, taxonomy, sequence and place on the phylogeny, in one BIOM v2.1 (HDF5) file. This is the file to load into rbiom, QIIME 2 or biom-format. The same table in plain text and in BIOM v1.0 JSON sits beside it.
Start here | HELD:raw-sequences/ | raw-sequences/ | Every sequencing file this analysis was run on, exactly as it went in. Listed here for the record; the files themselves come down with the archive below.

Abundance tables | feature_table/ | | The feature table in all three formats it was written in: classic tab-separated text (one row per ASV, one column per sample, taxonomy in the last column), BIOM v1.0 JSON, and BIOM v2.1 HDF5. The same numbers each time. Both BIOM files also carry the phylogeny, but only the HDF5 one puts it where the BIOM 2.1 spec says it goes, so only that one is read by anything other than rbiom.
Abundance tables | abundance_tables/ | | Counts collapsed to each taxonomic rank, and the same tables as a share of each sample. Unrarefied, like everything else here - rarefy before comparing samples.
Abundance tables | dada2/ASV_table.tsv | | ASV counts as DADA2 produced them, before the excluded taxa were dropped.
Abundance tables | summary_tables/ | | Overall abundance and taxonomy summaries.

Taxonomy | dada2/ASV_tax_species.*.tsv | | Taxonomy for each ASV, down to species where the sequence matched a reference exactly.
Taxonomy | dada2/ASV_tax.*.tsv | | Taxonomy for each ASV from the DADA2 classifier, genus level and above.
Taxonomy | qiime2/taxonomy/ | | The second opinion from the QIIME 2 classifier, when one was requested.
Taxonomy | kraken2/ | | Read-level classification with Kraken2, when one was requested.
Taxonomy | sintax/ | | Read-level classification with SINTAX, when one was requested.
Taxonomy | dada2/ref_taxonomy.*.txt | | Which reference database was used for the assignments above, and how to cite it.

Sequences | dada2/ASV_seqs.fasta | | The ASV sequences themselves, named by the hash used as the feature ID in every table here.
Sequences | savont/ | | The ASVs Savont called from Oxford Nanopore reads, in place of DADA2.
Sequences | pplace/asv_tree.newick | | The phylogeny UniFrac and Faith's PD are computed over: this run's ASVs, named as they are everywhere else here, on the branch lengths EPA-NG placed them at within the GTDB bacterial 16S tree.
Sequences | pplace/ | | The placement behind that tree - the full GTDB reference with this run's ASVs grafted into it, and EPA-NG's .jplace record of where each one landed and how confidently.

Diversity | alpha_diversity.tsv | | Per-sample diversity, computed by rbiom on the unrarefied feature table: read depth, observed ASVs, and every index that means anything on denoised data - Shannon, Simpson, inverse Simpson, Faith's PD, Berger-Parker, Brillouin, Fisher's alpha, Margalef, Menhinick and McIntosh. These are the numbers behind the second plot on the Overview. Rarefy the feature table before comparing these between samples.

Functional prediction | picrust/ | | PICRUSt2's predicted gene and pathway abundances, inferred from the 16S profile rather than measured.

Quality control | overall_summary.tsv | | Reads surviving each stage of the pipeline, one row per sample. The first place to look when a sample comes out thin.
Quality control | dada2/DADA2_stats.tsv | | The same accounting for the DADA2 steps alone: filtering, denoising, merging, and chimera removal.
Quality control | fastqc/ | | The FastQC report for each individual FASTQ file, which MultiQC summarises.
Quality control | dada2/QC/ | | Read quality profiles and the fitted DADA2 error models, as PDF.
Quality control | barrnap/ | | Which ASVs look like rRNA genes, and of what kind. Anything that is neither a bacterial nor an archaeal SSU is dropped here, along with the record of what went.
Quality control | asv_length_filter/ | | The ASVs dropped for falling outside the length the detected region predicts - unmerged read pairs, chimeras and off-target product - and the length distribution before and after.
Quality control | cutadapt/ | | Primer trimming logs, one per sample.

How this run was set up | ampliseq_args.yaml | | Every parameter the pipeline was given.
How this run was set up | nextflow_command.sh | | The command that produced these results, exactly as it was run.
How this run was set up | region_detection.txt | | How the amplified region and the sequencing platform were measured from the reads.
How this run was set up | input/ampliseq_samplesheet.tsv | | The samplesheet the pipeline read, after sample names were merged and sanitised.
How this run was set up | pipeline_info/ | | Nextflow's own execution report, timeline, trace and software versions.

Everything at once | __BUNDLE_URL__ | Everything from this run | One zip holding the raw sequencing data and every file listed above, plus the pages you are reading them through. It unpacks into raw-sequences/ beside results/; open the index.html in results/ to browse it all offline, raw sequences included. This is the whole of what expires.
